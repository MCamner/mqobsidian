name: Markdownlint

on:
  workflow_dispatch:
  # Scoped to main: a bare `push:` also fires on feature branches, so a branch
  # with an open PR reports the same check name twice on one SHA, and required
  # status checks match on the name while ignoring the event. Pushes to main
  # stay post-merge verification.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Rules and scope (globs/ignores) both live in .markdownlint-cli2.jsonc,
      # so CI matches local `markdownlint-cli2`. Only hand-authored prose is
      # linted; generated exports, agent-memory views, and Obsidian templates
      # are out of scope by design.
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

name: Public Safe Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Validate export scaffolding
        run: python3 scripts/validate-export.py

      - name: Check for sensitive content
        run: python3 scripts/check-sensitive-content.py

      - name: Check token budget
        run: python3 scripts/check-token-budget.py

      - name: Check context front doors
        run: python3 scripts/check-context-links.py

      # docs/memory-model.md is fed to agents by mq-mcp's semantic memory pack,
      # so a stale contract list there reaches consumers, not just readers.
      - name: Check published docs freshness
        run: python3 scripts/check-docs-freshness.py

      # Pinned, not floating. Ruff's rule set changes between releases, and a
      # gate whose rules move on their own is not reproducible: a bump could turn
      # a green branch red without a single line of this repo changing. The rule
      # selection lives in ruff.toml so it is the repo's decision rather than an
      # editor extension's default — which is what it was before, silently.
      - name: Lint Python (ruff, pinned)
        run: |
          python3 -m pip install ruff==0.16.4
          ruff --version
          ruff check .

      - name: Run focused unit tests
        run: python3 -m unittest discover -s tests -q

      - name: Check agent-entrypoint canonical contract
        run: python3 scripts/check-agent-entrypoints.py

      - name: Check context exports are regenerated
        run: |
          python3 scripts/generate-repo-context-export.py --all
          if ! git diff --quiet -- examples/repo-context-exports; then
            echo "::error::examples/repo-context-exports is stale. Run: python3 scripts/generate-repo-context-export.py --all"
            git diff -- examples/repo-context-exports
            exit 1
          fi
